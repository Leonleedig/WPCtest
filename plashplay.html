<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plash YouTube Container - Fixed</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        #video-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none; 
        }

        iframe {
            width: 100vw;
            height: 100vh;
            border: none;
            /* 縮放以隱藏 UI，並確保填滿 */
            transform: scale(1.15);
            transform-origin: center center;
        }

        #ui-layer {
            position: absolute;
            bottom: 40px;
            left: 40px;
            z-index: 10;
            color: rgba(255, 255, 255, 0.8);
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
            pointer-events: none;
        }

        #clock {
            font-size: 4rem;
            font-weight: 200;
            letter-spacing: -2px;
        }

        #status {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            opacity: 0.6;
        }

        /* 錯誤訊息提示 */
        #error-msg {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            text-align: center;
            z-index: 20;
            background: rgba(255,0,0,0.2);
            padding: 20px;
            border-radius: 10px;
            backdrop-filter: blur(5px);
        }
    </style>
</head>
<body>

    <div id="error-msg">
        <h3>播放器載入失敗</h3>
        <p>建議將此檔案上傳至 GitHub Pages 或使用本地伺服器開啟</p>
    </div>

    <div id="video-container">
        <div id="player"></div>
    </div>

    <div id="ui-layer">
        <div id="status">Ambient Mode • Live</div>
        <div id="clock">00:00</div>
    </div>

    <script>
        const VIDEO_ID = 'WIl1cufYYF0'; 

        // 嘗試自動獲取當前網址作為 origin，這是解決錯誤 153 的關鍵
        const currentOrigin = window.location.origin === 'null' ? 'https://www.youtube.com' : window.location.origin;

        const tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        const firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        let player;

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', {
                videoId: VIDEO_ID,
                playerVars: {
                    'autoplay': 1,
                    'controls': 0,
                    'loop': 1,
                    'playlist': VIDEO_ID,
                    'mute': 1,
                    'modestbranding': 1,
                    'rel': 0,
                    'enablejsapi': 1,
                    'origin': currentOrigin // 顯式傳遞 origin
                },
                events: {
                    'onReady': (event) => {
                        event.target.playVideo();
                    },
                    'onError': (event) => {
                        console.error("YouTube Player Error:", event.data);
                        document.getElementById('error-msg').style.display = 'block';
                    },
                    'onStateChange': (event) => {
                        if (event.data === YT.PlayerState.ENDED) {
                            player.playVideo();
                        }
                    }
                }
            });
        }

        function updateClock() {
            const now = new Date();
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('clock').textContent = `${h}:${m}`;
        }

        setInterval(updateClock, 1000);
        updateClock();

        window.addEventListener('keydown', (e) => {
            if (e.key === 'm') {
                if (player.isMuted()) {
                    player.unMute();
                } else {
                    player.mute();
                }
            }
        });
    </script>
</body>
</html>
